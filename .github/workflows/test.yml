name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careblue
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: careblue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careblue -d careblue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://careblue:test-only-password@localhost:5432/careblue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: node --test tests/test_forms.cjs tests/test_theme.cjs
      - run: find static/js -name '*.js' -exec node --check {} \;
