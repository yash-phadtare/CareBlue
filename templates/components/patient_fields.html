{% macro patient_fields(prefix='', patient=none) %}
<div class="md-field"><label for="{{ prefix }}name">Patient name</label><input id="{{ prefix }}name" name="{{ prefix }}name" required maxlength="120" autocomplete="name" value="{{ request.form.get(prefix+'name', patient.name if patient else '') }}" placeholder="Full name"></div>
<div class="md-grid-3">
<div class="md-field"><label for="{{ prefix }}age">Age (optional)</label><input type="number" id="{{ prefix }}age" name="{{ prefix }}age" min="0" max="130" value="{{ request.form.get(prefix+'age', patient.age if patient and patient.age is not none else '') }}" placeholder="If known"></div>
<div class="md-field"><label for="{{ prefix }}gender">Gender (optional)</label><select id="{{ prefix }}gender" name="{{ prefix }}gender">{% set selected=request.form.get(prefix+'gender',patient.gender if patient else 'Not recorded') %}{% for gender in ['Not recorded','Male','Female','Other'] %}<option {% if selected==gender %}selected{% endif %}>{{ gender }}</option>{% endfor %}</select></div>
<div class="md-field"><label for="{{ prefix }}contact">Contact (optional)</label><input type="tel" id="{{ prefix }}contact" name="{{ prefix }}contact" maxlength="30" autocomplete="tel" value="{{ request.form.get(prefix+'contact',patient.contact if patient else '') }}" placeholder="Phone number"></div>
</div>
<details class="md-expansion"><summary>Address and clinical notes (optional)</summary><div class="md-expansion-body md-stack">
<div class="md-field"><label for="{{ prefix }}address">Address</label><input id="{{ prefix }}address" name="{{ prefix }}address" maxlength="2000" autocomplete="street-address" value="{{ request.form.get(prefix+'address',patient.address if patient else '') }}"></div>
<div class="md-field"><label for="{{ prefix }}allergies">Allergies</label><textarea id="{{ prefix }}allergies" name="{{ prefix }}allergies" rows="2" maxlength="2000" placeholder="Known allergies, or explicitly document none known">{{ request.form.get(prefix+'allergies',patient.allergies if patient else '') }}</textarea></div>
<div class="md-field"><label for="{{ prefix }}medical_history">Medical history</label><textarea id="{{ prefix }}medical_history" name="{{ prefix }}medical_history" rows="3" maxlength="10000">{{ request.form.get(prefix+'medical_history',patient.medical_history if patient else '') }}</textarea></div>
</div></details>
{% endmacro %}
