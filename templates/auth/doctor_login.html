{% extends "base.html" %}
{% block title %}Doctor sign in{% endblock %}
{% block content %}
<div class="md-auth-wrap"><div class="md-auth-card">
    <div class="md-auth-form">
        <h1>Doctor sign in</h1>
        <p class="muted">Use the username from your admin.</p>
        <form method="POST" action="{{ login_url if hospital else url_for('auth.doctor_login') }}" data-submit-message="Signing in…" novalidate class="md-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="md-field"><label for="username">Username</label><input id="username" name="username" required autofocus autocomplete="username" placeholder="e.g. dr_meera"></div>
            <div class="md-field"><label for="password">Password</label><div class="md-pass-wrap"><input type="password" id="password" name="password" required autocomplete="current-password"><button type="button" class="md-pass-toggle" data-pass-toggle="password" aria-label="Show password" aria-pressed="false"><i data-lucide="eye"></i></button></div></div>
        <details class="md-expansion"><summary>Authenticator code (if enabled)</summary><div class="md-expansion-body"><div class="md-field"><label for="mfa_code">Authenticator code (if enabled)</label><input name="mfa_code" id="mfa_code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></div></div></details>
            <button class="md-btn md-btn--filled md-btn--lg md-full" type="submit">Sign in<i data-lucide="arrow-right"></i></button>
</form>
<p><a href="{{ url_for('auth.reset_password') }}">Reset password</a></p>
        <p class="md-caption mt-4">Locked out? Your admin can reset access from Doctors → Access.</p>
    </div>
</div></div>
{% endblock %}
