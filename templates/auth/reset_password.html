{% extends 'base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="md-auth-wrap"><div class="md-card md-auth-single"><div class="md-card-body">
<h1 class="md-headline">Reset password</h1><p class="md-sub mb-4">Enter the one-use token provided by your administrator.</p>
<form method="post" data-auth-flow class="md-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="md-field"><label for="token">Reset token</label><input id="token" name="token" required autocomplete="off"></div>
<div class="md-field"><label for="password">New password</label><input id="password" name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></div>
<div class="md-field"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password"></div>
<button class="md-btn md-btn--filled">Change password</button></form></div></div></div>
{% endblock %}
