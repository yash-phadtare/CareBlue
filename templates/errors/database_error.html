<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records unavailable · CareBlue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout-utilities.css') }}">
</head>
<body class="md-service-error">
    <main class="md-card error-card" id="mainContent">
        <div class="md-empty">
            <div class="md-empty-icon" aria-hidden="true">!</div>
            <p class="md-error-code">Service unavailable</p>
            <h1>Records temporarily unavailable</h1>
            <p>We couldn’t reach your hospital’s records. Wait a moment, then retry. If you were saving a change, check whether it was saved before submitting again.</p>
            <div class="md-cluster"><a href="/" class="md-btn md-btn--outlined">Back to home</a><button class="md-btn md-btn--filled" data-action="reload" type="button">Retry</button></div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
